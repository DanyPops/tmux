# ══════════════════════════════════════════════════════════════════════════════
#  tmux config — Akko Blossom rice
#
#  Palette mirrored from lush_theme/akko.lua — three-zone story:
#
#    LEFT   — "Where am I?"   sky     #74a2c0   H≈207 cool/spatial
#    CENTER — "What am I?"    blossom #d4728a   H≈352 warm/active
#    RIGHT  — "How is it?"    leaf    #72b89e   H≈155 vitals
#                              gold    #d09e48   H≈38  date
#                              blossom #d4728a   H≈352 clock (echoes center)
#
#    Support:
#    bg0      #120c10   text on solid segments
#    dim      #8e6878   inactive window tabs
#    amber    #c4703a   H≈22  copy-mode selection
#
#  NerdFont glyphs used:
#    Powerline:   (U+E0B0)  (U+E0B2)  (U+E0B1)  (U+E0B3)
#    Icons:       (terminal)  (clock)  (calendar)  󰍛 (memory)  󰘚 (cpu)
# ══════════════════════════════════════════════════════════════════════════════

# ── Terminal ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# Pass cursor shape / blink through to Alacritty
set -as terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# ── Sane defaults ─────────────────────────────────────────────────────────────
set -g escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep server alive with no sessions, and land on next session when one is killed
set -g exit-empty off
set -g detach-on-destroy off

# OSC 52 — copy to system clipboard even over SSH
set -s set-clipboard on

# Renumber sessions sequentially
set-hook -g session-created 'run-shell "i=0; for s in $(tmux list-sessions -F \"##S\" | grep -E \"^[0-9]+$\" | sort -n); do [ \"$s\" != \"$i\" ] && tmux rename-session -t \"=$s\" \"$i\"; i=$((i+1)); done; true"'
set-hook -g session-closed  'run-shell "i=0; for s in $(tmux list-sessions -F \"##S\" | grep -E \"^[0-9]+$\" | sort -n); do [ \"$s\" != \"$i\" ] && tmux rename-session -t \"=$s\" \"$i\"; i=$((i+1)); done; true"'

set -g mouse on
setw -g aggressive-resize on

# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-z
bind C-z send-prefix

# ── Status bar position & layout ──────────────────────────────────────────────
set -g status-position top
set -g status-justify  absolute-centre
set -g status-interval 60                  # fallback poll — events drive real updates

# Base style: transparent canvas — segments keep their own bg
set -g status-style "bg=default,fg=#8e6878"

# ── Left: [ SESSION ] powerline pill ──────────────────────────────────────────
#   ╭────────────────╮
#   │  mysession    │  ← pink pill with powerline arrows
#   ╰────────────────╯
set -g status-left-length 40
set -g status-left "#{prefix_highlight}\
#[bg=#74a2c0,fg=#120c10,bold]  #S \
#[bg=default,fg=#74a2c0,nobold]"

# ── Right: [  dd Mon ] [  HH:MM ] ────────────────────────────────────────────
#   Two segments, right-to-left:  date (mid bg) → time (pink bg)
set -g status-right-length 80
set -g status-right "\
#[fg=#72b89e,bg=default]\
#[bg=#72b89e,fg=#120c10] #{battery_icon} #{battery_percentage} \
#[fg=#d4728a,bg=#72b89e]\
#[bg=#d4728a,fg=#120c10,bold] %d %b  %H:%M "

# ── Window tabs ───────────────────────────────────────────────────────────────
#   Inactive:  dim  1 zsh       (plain, dimmed)
#   Active:    ▌ 1 zsh ▐       (pink pill with powerline arrows)
set -g window-status-separator ""

#   Format: [CWD|COMMAND:Label]  — Label only shown when @label is set
#   Set:   tmux set -w @label "name"    Clear: tmux set -wu @label
set -g window-status-format \
"#[fg=#d4728a,dim] #I [#{b:pane_current_path}|#{pane_current_command}#{?#{@label},:#{@label},}] "

set -g window-status-current-format \
"#[fg=#d4728a,bg=default]#[fg=#120c10,bg=#d4728a,bold] #I [#{b:pane_current_path}|#{pane_current_command}#{?#{@label},:#{@label},}] #[fg=#d4728a,bg=default,nobold]"

# Activity: dim-gold tint on windows with unseen output — no underline, no bell
set -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style "fg=#d09e48,dim"

# Don't let tmux silently overwrite window names you've set
set -g allow-rename off

# ── Event-driven status refresh ───────────────────────────────────────────────
#   The shell emits an OSC title sequence on every prompt (PROMPT_COMMAND in
#   bash, precmd in zsh).  That fires pane-title-changed, which redraws the
#   status bar instantly — no fixed polling needed.
#
#   Shell side (add to ~/.bashrc):
#     _tmux_refresh() { [ -n "$TMUX" ] && printf '\033]0;_\a'; }
#     PROMPT_COMMAND="_tmux_refresh${PROMPT_COMMAND:+;$PROMPT_COMMAND}"
set-hook -g pane-title-changed  'refresh-client -S'
set-hook -g after-select-window 'refresh-client -S'
set-hook -g after-select-pane   'refresh-client -S'
set-hook -g window-pane-changed 'refresh-client -S'

# ── Pane transparency ────────────────────────────────────────────────────────
# Let Alacritty's opacity bleed through instead of tmux painting bg=bg1
set -g window-style        'bg=default'
set -g window-active-style 'bg=default'

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-lines        single         # requires tmux ≥ 3.2
set -g pane-border-style        "fg=#2d1b26"   # inactive — subtle/dark
set -g pane-active-border-style "fg=#72b89e"   # active   — leaf green

# ── Message & command prompt ──────────────────────────────────────────────────
set -g message-style         "bg=#d4728a,fg=#120c10,bold"
set -g message-command-style "bg=#261a20,fg=#d4728a"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -g mode-style "bg=#d09e48,fg=#120c10"   # selection highlight — gold

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#d4728a"
set -g clock-mode-style  24

# ── Vi mode ───────────────────────────────────────────────────────────────────
setw -g mode-keys vi

# ── Keybindings ───────────────────────────────────────────────────────────────

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# New window inherits CWD (splits already do this)
bind c new-window -c "#{pane_current_path}"

# Vim-style splits (keep current path)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Toggle between last two windows (double-prefix)
bind C-z last-window

# Reorder windows
bind -r '<' swap-window -d -t -1
bind -r '>' swap-window -d -t +1

# Drop into copy-mode without prefix
bind Enter copy-mode

# Broadcast keystrokes to all panes in window
bind e setw synchronize-panes \; display "sync: #{?pane_synchronized,ON,OFF}"

# Floating scratchpad popup  (C-z g)
bind g display-popup -E -h 80% -w 80% -S "fg=#d4728a" \
  "tmux new-session -A -s scratch"

# Vim-style copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle

# Reload config
bind R source-file ~/.config/tmux/tmux.conf \; display "  Config reloaded"

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect: save/restore pane contents too
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'   # restore Neovim sessions

# Continuum: auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'        # save every 15 min

# ── Extras ────────────────────────────────────────────────────────────────────
# CPU & RAM
set -g @plugin 'tmux-plugins/tmux-cpu'

# Prefix held indicator
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @prefix_highlight_fg '#120c10'
set -g @prefix_highlight_bg '#d4728a'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#120c10,bg=#d09e48,bold'

# Battery
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @batt_icon_charge_tier8 ''
set -g @batt_icon_charge_tier7 ''
set -g @batt_icon_charge_tier6 ''
set -g @batt_icon_charge_tier5 ''
set -g @batt_icon_charge_tier4 ''
set -g @batt_icon_charge_tier3 ''
set -g @batt_icon_charge_tier2 ''
set -g @batt_icon_charge_tier1 ''
set -g @batt_icon_status_charged  ''
set -g @batt_icon_status_charging ''
set -g @batt_icon_status_discharging ''
set -g @batt_color_full_charge    '#72b89e'   # leaf  — full
set -g @batt_color_high_charge    '#72b89e'   # leaf  — high
set -g @batt_color_medium_charge  '#d09e48'   # gold  — medium
set -g @batt_color_low_charge     '#d4693e'   # sienna — low

# Fuzzy session / window switcher
set -g @plugin 'sainnhe/tmux-fzf'
bind f run-shell -b '~/.tmux/plugins/tmux-fzf/scripts/session.sh'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
